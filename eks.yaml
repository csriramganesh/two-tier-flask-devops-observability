apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: observability-eks
  region: ap-south-1
  version: "1.36"

iam:
  withOIDC: true

managedNodeGroups:
  - name: observability-ng

    instanceType: t3.medium

    desiredCapacity: 2
    minSize: 2
    maxSize: 2

    volumeSize: 20

    labels:
      role: worker

    tags:
      Project: observability-project
