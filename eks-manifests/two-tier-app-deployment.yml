apiVersion: apps/v1

kind: Deployment
metadata:
  name: two-tier-app
  labels:
    app: two-tier-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: two-tier-app

  template:
    metadata:
      labels:
        app: two-tier-app

    spec:
      containers:
        - name: two-tier-app
          image: csriramganesh/two-tier-flask-app:v2
          imagePullPolicy: Always

          env:
            - name: MYSQL_HOST
              value: mysql

            - name: MYSQL_USER
              value: admin

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DB
              value: mydb

          ports:
            - containerPort: 5000
