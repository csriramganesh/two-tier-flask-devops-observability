apiVersion: apps/v1
kind: Deployment

metadata:
  name: two-tier-app
  labels:
    app: two-tier-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: two-tier-app

  template:
    metadata:
      labels:
        app: two-tier-app

    spec:


      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for MySQL..."
            until nc -z mysql 3306; do
              echo "MySQL is not ready yet..."
              sleep 2
            done
            echo "MySQL is ready."

      containers:
        - name: two-tier-app
          image: csriramganesh/two-tier-flask-app:v3
          imagePullPolicy: Always

          env:
            - name: MYSQL_HOST
              value: mysql

            - name: MYSQL_USER
              value: admin

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DB
              value: mydb

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          # -------------------------
          # Kubernetes Health Checks
          # -------------------------

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # -------------------------
          # CPU / Memory
          # -------------------------

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
